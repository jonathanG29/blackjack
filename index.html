<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
  </head>
  <body>

    <main class="mesa">

        <header class="barra">
            <div class="jugador-info">
                <span class="nombre nombre-jugador">Jugador</span>
                <span class="saldo" aria-label="Saldo en fichas"><span id="saldo">1000</span></span>
            </div>

            <h1 class="titulo">Blackjack</h1>

            <div class="lado-derecho">
                <p class="marcador" aria-label="Partidas ganadas, perdidas y empatadas">
                    <span>G <b id="ganadas">0</b></span>
                    <span>P <b id="perdidas">0</b></span>
                    <span>E <b id="empates">0</b></span>
                </p>
                <div class="menu">
                    <button id="btnMenu" class="btn-menu" aria-label="Opciones" aria-expanded="false" aria-controls="menu-opciones">
                        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><circle cx="8" cy="3" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="8" cy="13" r="1.6"/></g></svg>
                    </button>
                    <div id="menu-opciones" class="menu-opciones" hidden>
                        <button id="btnCambiarNombre">Cambiar nombre</button>
                        <button id="btnReiniciarMarcador">Reiniciar marcador</button>
                    </div>
                </div>
            </div>
        </header>

        <section class="juego">

            <div class="mano crupier">
                <span class="etiqueta">Crupier <span id="puntos-computadora" class="puntos" hidden>0</span></span>
                <div id="computadora-cartas" class="cartas">
                    <div class="hueco"></div><div class="hueco"></div>
                </div>
            </div>

            <div class="centro-mesa">
                <span class="leyenda">Blackjack paga 3 a 2 · El crupier se planta en 17</span>
                <div id="circulo-apuesta" class="circulo-apuesta" aria-label="Apuesta"></div>

                <div id="resultado" class="cartel" role="status" hidden>
                    <span id="resultado-titulo" class="cartel-titulo"></span>
                    <span id="resultado-detalle" class="cartel-detalle"></span>
                </div>
                <span id="pista" class="pista" hidden>Elige tus fichas para empezar</span>
            </div>

            <div class="mano jugador">
                <div id="jugador-cartas" class="cartas">
                    <div class="hueco"></div><div class="hueco"></div>
                </div>
                <span class="etiqueta"><span class="nombre-jugador">Jugador</span> <span id="puntos-jugador" class="puntos" hidden>0</span></span>
            </div>

        </section>

        <footer class="acciones">

            <!-- Antes de repartir: se elige la apuesta -->
            <div id="panel-apuesta" class="panel" hidden>
                <button class="ficha f10" data-valor="10" aria-label="Apostar 10 fichas">10</button>
                <button class="ficha f25" data-valor="25" aria-label="Apostar 25 fichas">25</button>
                <button class="ficha f50" data-valor="50" aria-label="Apostar 50 fichas">50</button>
                <button class="ficha f100" data-valor="100" aria-label="Apostar 100 fichas">100</button>
                <span class="separador" aria-hidden="true"></span>
                <button id="btnLimpiarApuesta" class="boton">Limpiar</button>
                <button id="btnRepartir" class="boton principal" disabled>Repartir</button>
                <button id="btnRecargar" class="boton principal" hidden>Sin fichas: recargar 1000</button>
            </div>

            <!-- Durante la partida -->
            <div id="panel-juego" class="panel" hidden>
                <button id="btnPedir" class="boton" disabled>Pedir carta</button>
                <button id="btnDoblar" class="boton" disabled>Doblar</button>
                <button id="btnDetener" class="boton principal" disabled>Plantarse</button>
            </div>

        </footer>

    </main>

    <dialog id="modal-nombre" class="bienvenida">
        <form id="form-nombre" method="dialog">
            <h2>Bienvenido a la mesa</h2>
            <p>Empiezas con 1000 fichas. Acércate a 21 sin pasarte y gánale al crupier.</p>
            <label for="input-nombre">¿Cómo te llamas?</label>
            <input id="input-nombre" type="text" maxlength="20" placeholder="Tu nombre" autocomplete="off" required autofocus>
            <button class="boton">Sentarse a jugar</button>
        </form>
    </dialog>

    <script type="module" src="/main.js"></script>
  </body>
</html>
