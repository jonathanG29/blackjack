<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  </head>
  <body>

    <header class="titulo">
        Blackjack
    </header>
    
    <main class="container">

        <div class="row mt-2">
            <div id="divBotones" class="col text-center">

                <button id="btnNuevo" class="btn btn-danger">Nuevo Juego</button>
                <button id="btnPedir" class="btn btn-primary">Pedir carta</button>
                <button id="btnDetener" class="btn btn-primary" disabled>Detener</button>

                <p id="marcador" class="marcador mt-3 mb-0">
                    Ganadas: <strong id="ganadas">0</strong> ·
                    Perdidas: <strong id="perdidas">0</strong> ·
                    Empates: <strong id="empates">0</strong>
                </p>
                <button id="btnCambiarNombre" class="btn btn-link btn-sm text-white">Cambiar nombre</button>
                <button id="btnReiniciarMarcador" class="btn btn-link btn-sm text-white">Reiniciar marcador</button>

                <div id="resultado" class="alert fw-bold mx-auto mt-3" style="max-width: 400px;" role="status" hidden></div>

            </div>
        </div>

        <div class="row">
            <div class="col">

                <h1><span id="nombre-jugador">Jugador 1</span> - <small id="puntos-jugador">0</small></h1>
                <div id="jugador-cartas">
                    <!-- <img class="carta" src="assets/cartas/2C.png"> -->
                </div>

            </div>
        </div>

        <div class="row mt-2">
            <div class="col">

                <h1>Computadora - <small id="puntos-computadora">0</small></h1>
                <div id="computadora-cartas">
                    <!-- <img class="carta" src="assets/cartas/3C.png"> -->
                </div>

            </div>
        </div>

    </main>

    <dialog id="modal-nombre" class="modal-nombre">
        <form id="form-nombre" method="dialog">
            <label for="input-nombre" class="form-label fw-bold">¿Cómo te llamas?</label>
            <input id="input-nombre" class="form-control" type="text" maxlength="20" placeholder="Tu nombre" autocomplete="off" required autofocus>
            <button class="btn btn-primary w-100 mt-3">Empezar</button>
        </form>
    </dialog>

    <script type="module" src="/main.js"></script>
  </body>
</html>
